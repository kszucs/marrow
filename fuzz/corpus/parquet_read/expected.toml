#
# What replaying each input must do -- see devkit/fuzzing.py. Bug ids are the
# fuzzing entry in backlog.md; a `crash` entry whose bug is fixed fails the
# replay until its verdict here moves to `accept` or `reject`.

["none.parquet"]
verdict = "accept"
note = "primitives, booleans, strings, lists, structs and dictionaries, with nulls"

["snappy.parquet"]
verdict = "accept"

["zstd.parquet"]
verdict = "accept"

["gzip.parquet"]
verdict = "accept"

["brotli.parquet"]
verdict = "accept"

["lz4.parquet"]
verdict = "accept"

["v2.parquet"]
verdict = "accept"
note = "data page v2, zstd"

["plain.parquet"]
verdict = "accept"
note = "no dictionary encoding"

["delta.parquet"]
verdict = "accept"
note = "DELTA_BINARY_PACKED, BYTE_STREAM_SPLIT, DELTA_BYTE_ARRAY, a page index"

["delta-length.parquet"]
verdict = "accept"
note = "DELTA_LENGTH_BYTE_ARRAY"

["index.parquet"]
verdict = "accept"
note = "a page index over small pages"

["truncated.parquet"]
verdict = "reject"

["b8-schema-children.parquet"]
verdict = "reject"
bug = "B8"

["b9-dictionary-page-short.parquet"]
verdict = "crash"
bug = "B9"
match = "LittleEndian"

["b10-page-values-overflow.parquet"]
verdict = "crash"
bug = "B10"
note = "plain builds stop at a Bitmap bounds assertion, ASAN at the value write"

["b11-row-group-columns.parquet"]
verdict = "reject"
bug = "B11"

["b12-page-header-missing.parquet"]
verdict = "reject"
bug = "B12"

["b13-rle-run-truncated.parquet"]
verdict = "crash"
bug = "B13"
match = "marrow/parquet/codecs.mojo:66"

["b14-page-size-negative.parquet"]
verdict = "reject"
bug = "B14"

["b15-levels-length.parquet"]
verdict = "reject"
bug = "B15"

["b-pr4-row-group-rows-negative.parquet"]
verdict = "reject"
bug = "B-PR4"
note = "a negative RowGroup.num_rows sized the leaf builders' buffers"

["b-pr6-fixed-dictionary-short.parquet"]
verdict = "crash"
bug = "B-PR6"
sanitizer = "address"
note = "a fixed-width dictionary page with fewer bytes than num_values: PrimitiveLeafBuilder.consume copies past the page"

["b-pr7-dictionary-index-bytes.parquet"]
verdict = "crash"
bug = "B-PR7"
match = "marrow/parquet/reader.mojo:925"
note = "a dictionary index past a byte-array dictionary: ByteArrayLeafBuilder._place_dictionary slices past it"

["b-pr8-dictionary-index-gather.parquet"]
verdict = "crash"
bug = "B-PR8"
note = "more values than rows, as B10, but on the dictionary fast path: Rle.gather writes past the values buffer (ASAN); a plain build stops at a Bitmap bounds assertion"

["b-pr9-dictionary-bit-width.parquet"]
verdict = "crash"
bug = "B-PR9"
match = "marrow/parquet/codecs.mojo:89"
note = "a dictionary-index bit width over 32 reaches Rle unchecked from PrimitiveLeafBuilder.consume"

["b-pr10-levels-count-overread.parquet"]
verdict = "crash"
bug = "B-PR10"
match = "marrow/utils/byteorder.mojo:186"
note = "Rle.count_matches reads past the v1 definition levels it is given"

["b-pr11-plain-byte-array-length.parquet"]
verdict = "reject"
bug = "B-PR11"
note = "a PLAIN byte-array value whose 4-byte length runs past the page"

["b-pr12-rle-boolean-length.parquet"]
verdict = "crash"
bug = "B-PR12"
match = "marrow/parquet/codecs.mojo:1058"
note = "an RLE boolean page whose 4-byte length runs past the values"
