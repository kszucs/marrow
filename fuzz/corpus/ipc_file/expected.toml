#
# What replaying each input must do -- see devkit/fuzzing.py. Bug ids are the
# fuzzing entry in backlog.md; a `crash` entry whose bug is fixed fails the
# replay until its verdict here moves to `accept` or `reject`. The file reader
# shares the stream reader's batch decoder, so these are the same bugs reached
# through the footer.

["all.arrow"]
verdict = "accept"
note = "every layout the reader decodes, with nulls, over several batches"

["dictionary.arrow"]
verdict = "accept"

["empty.arrow"]
verdict = "accept"

["truncated.arrow"]
verdict = "reject"

["b1-body-range.arrow"]
verdict = "reject"
bug = "B1"
note = "fixed: `_body_buffer` refuses a buffer outside the body (392829c4)"

["b1-body-alloc.arrow"]
verdict = "reject"
bug = "B1"
note = "a buffer length of terabytes; fixed: refused by the same body check (392829c4)"

["b2-node-count.arrow"]
verdict = "reject"
bug = "B2"
note = "fixed: running out of field nodes or buffers raises"

["b2-buffer-count.arrow"]
verdict = "reject"
bug = "B2"
note = "fixed: running out of field nodes or buffers raises"

["b3-utf8-field-name.arrow"]
verdict = "reject"
bug = "B3"
note = "fixed: flatbuffer strings are validated as UTF-8"

["b4-dictionary-type.arrow"]
verdict = "reject"
bug = "B4"
note = "fixed: a DictionaryEncoding that does not read is refused, not ignored"

["b6-buffer-short.arrow"]
verdict = "reject"
bug = "B6"
note = "fixed: B3 stopped swallowing errors under a field, and its metadata is malformed too, so it is refused there; B6 itself is pinned in test_ipc.mojo"

["b7-nulls-without-bitmap.arrow"]
verdict = "reject"
bug = "B7"
note = "fixed: the reader validates every array it builds"
