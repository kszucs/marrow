project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - tutorials/*.qmd
    - guide/*.qmd
    - reference/*.qmd
    - examples/*.qmd

website:
  title: "Marrow"
  description: "Apache Arrow in Mojo — one query engine with three frontends: eager Python, lazy Python, and queries compiled ahead of time into a standalone binary."
  image: assets/logo.png
  favicon: assets/logo.png
  open-graph: true
  twitter-card: true
  site-url: https://marrow.kszucs.dev
  repo-url: https://github.com/kszucs/marrow
  page-navigation: true
  back-to-top-navigation: true

  navbar:
    logo: assets/logo.png
    logo-alt: "marrow"
    pinned: true
    collapse-below: lg
    left:
      - text: "Home"
        href: index.qmd
      - text: "Tutorials"
        href: tutorials/quickstart.qmd
      - text: "Guide"
        href: guide/arrays.qmd
      - text: "Reference"
        href: reference/architecture.qmd
    right:
      - text: "Benchmarks"
        href: /benchmarks/
      - icon: github
        href: https://github.com/kszucs/marrow
        aria-label: GitHub

  sidebar:
    style: floating
    collapse-level: 2
    contents:
      - section: "Start here"
        contents:
          - text: "10-minute quickstart"
            href: tutorials/quickstart.qmd
          - text: "Build a data pipeline"
            href: tutorials/data-pipeline.qmd
      - section: "Data"
        contents:
          - text: "Arrays"
            href: guide/arrays.qmd
          - text: "Type system"
            href: guide/types.qmd
          - text: "Scalars"
            href: guide/scalars.qmd
          - text: "Tables & joins"
            href: guide/tables.qmd
      - section: "Compute"
        contents:
          - text: "Compute kernels"
            href: guide/compute.qmd
          - text: "Sorting"
            href: guide/sorting.qmd
          - text: "GPU execution"
            href: guide/gpu.qmd
      - section: "Queries"
        contents:
          - text: "Lazy queries (Python)"
            href: guide/queries-lazy.qmd
          - text: "Queries in Mojo"
            href: guide/expressions.qmd
          - text: "Compile a query"
            href: guide/compile.qmd
      - section: "I/O & interop"
        contents:
          - text: "Parquet & Arrow IPC"
            href: guide/io.qmd
          - text: "PyArrow interop"
            href: guide/interop.qmd
          - text: "DataFusion UDFs"
            href: examples/datafusion.qmd
      - section: "Reference"
        contents:
          - text: "Architecture"
            href: reference/architecture.qmd
          - text: "Status & limitations"
            href: reference/status.qmd

  page-footer:
    border: true
    left: "Marrow — Apache Arrow in Mojo. Built with [Quarto](https://quarto.org)."
    right:
      - icon: github
        href: https://github.com/kszucs/marrow

format:
  html:
    theme:
      dark: theme/marrow-dark.scss
      light: theme/marrow-light.scss
    css: theme/marrow.css
    include-in-header:
      - theme/head.html
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    link-external-icon: false
    grid:
      sidebar-width: 260px
      body-width: 860px

execute:
  freeze: auto
  cache: true
