[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marrow"
version = "0.1.0"
description = "Apache Arrow implementation in Mojo"
readme = "README.md"
requires-python = ">=3.14"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# No packages — the hook adds both __init__.py and the compiled extension
# explicitly via force_include, mapping python/ → marrow/ in site-packages.
packages = []

[tool.cibuildwheel]
# Only CPython 3.14 — Mojo's Python bindings are tied to 3.14.
build = "cp314-*"
skip = "*-musllinux*"

# Runs natively on macOS runner; runs inside manylinux container on Linux.
# Installs pixi to /usr/local/bin (works in both environments).
before-build = [
    "curl -fsSL https://pixi.sh/install.sh | PIXI_HOME=/usr/local bash",
    "pixi install --frozen",
    "pixi run build_python",
]

[tool.cibuildwheel.macos]
archs = ["arm64"]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
repair-wheel-command = "auditwheel repair -w {dest_dir} --plat manylinux_2_28_x86_64 {wheel}"
