[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marrow"
version = "0.1.0"
description = "Apache Arrow implementation in Mojo"
readme = "README.md"
requires-python = ">=3.14"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# No packages — the hook adds both __init__.py and the compiled extension
# explicitly via force_include, mapping python/ → marrow/ in site-packages.
packages = []

[tool.cibuildwheel]
build = "cp314-*"
skip = "*-musllinux*"
enable = ["cpython-prerelease"]
before-build = "pip install --pre 'mojo-compiler==1.0.0b2.dev2026051106' --extra-index-url https://whl.modular.com/nightly/simple/"

[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = "pip install delocate"
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_34"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
