[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marrow"
version = "0.1.0"
description = "Apache Arrow implementation in Mojo"
readme = "README.md"
requires-python = ">=3.14"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# No packages — the hook adds both __init__.py and the compiled extension
# explicitly via force_include, mapping python/ → marrow/ in site-packages.
packages = []

[tool.cibuildwheel]
build = "cp314-*"
skip = "*-musllinux*"
enable = ["cpython-prerelease"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = [
    "pip install delocate",
    "curl -fsSL https://pixi.sh/install.sh | PIXI_HOME=/usr/local bash",
    "pixi install --frozen",
]
before-build = "pixi run build_python"
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = [
    "curl -fsSL https://pixi.sh/install.sh | PIXI_HOME=/usr/local bash",
    "pixi install --frozen",
]
before-build = "pixi run build_python"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
