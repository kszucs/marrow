[build-system]
# 1.27 is the first hatchling with PEP 639 (`license` expression, `license-files`).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "marrow"
version = "0.1.0"
description = "Apache Arrow implementation in Mojo"
readme = "README.md"
requires-python = ">=3.14"
# marrow's own code is Apache-2.0; the rest is what a wheel bundles beside it.
# `NOTICE.txt` says which component carries which licence, and
# `licenses/` holds every text. `LicenseRef-Modular` stands for the Mojo
# runtime libraries' terms until Modular confirms which ones apply.
license = "Apache-2.0 AND MIT AND BSD-2-Clause AND BSD-3-Clause AND ISC AND Unicode-3.0 AND Zlib AND Apache-2.0 WITH LLVM-exception AND LicenseRef-Modular"
# Symlinks to the repository root (PEP 639 forbids paths outside `python/`).
# `licenses/*` matches files only, so `licenses/bundle-only/` -- texts that a
# `marrow compile --bundle` directory may need but a wheel never ships -- stays out.
license-files = ["LICENSE.txt", "NOTICE.txt", "licenses/*"]

[project.scripts]
marrow = "marrow.compile:main"

[project.optional-dependencies]
compile = ["mojo>=1.2,<2"]

[tool.hatch.build.hooks.custom]
path = "build.py"

[tool.hatch.build.targets.wheel]
# only-include = [] means hatchling auto-discovers nothing; the hook's
# force_include adds exactly marrow/__init__.py and the compiled extension.
only-include = []

[tool.hatch.build.targets.editable]
# For editable installs, hatchling adds python/ to sys.path so import marrow
# finds python/marrow/__init__.py directly; the hook still builds libmarrow.so.
packages = ["marrow"]

[tool.cibuildwheel]
build = "cp314-*"
skip = "*-musllinux*"
enable = ["cpython-prerelease"]
# The pins are `pixi.toml`'s -- `mojo-compiler` from `[package.build-dependencies]`,
# `max-core` matching `[dependencies] max` -- and `devkit/tests/test_pins.py`
# fails if they drift. `max-core` is needed because marrow imports `max.*`.
before-build = "pip install --pre 'mojo-compiler==1.2.0.dev2026092105' 'max-core==26.7.0.dev2026092105' --extra-index-url https://whl.modular.com/nightly/simple/"

# `build.py` embeds every `dlopen`-ed library it can resolve at build time --
# the page codecs and `libopendal_c`. Neither `delocate` nor `auditwheel` can
# find those for us: both walk load commands, and a `dlopen`-ed library has
# none. `MARROW_OPENDAL_LIBRARY` is what `optional_lib_paths()` reads; the
# codecs come from the environment `mojo` itself lives in. UNVERIFIED on CI --
# see the header of `.github/workflows/wheels.yml`.
[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = "pip install delocate && bash {project}/../scripts/build_opendal_c.sh"
environment = { MARROW_OPENDAL_LIBRARY = "{project}/../vendor/opendal/bindings/c/target/release/libopendal_c.dylib" }
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_34"
# The manylinux image has no rust; the wheel simply ships without OpenDAL if
# this leg is left as is. `optional_lib_paths()` is silent about that on
# purpose -- remote storage is opt-in and a wheel without it reads every local
# file.
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
