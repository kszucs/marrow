name: _diag

# TEMPORARY -- lives on the `ci-diag` branch only, deleted before merging.
#
# Round 1: libm.so is present, libc6-dev installed, a trivial mojo program runs,
#          marrow/tests/test_dtypes.mojo alone passes in 7 s.
# Round 2: LIBRARY_PATH makes no difference.
# Round 3: nor does symlinking libm into $CONDA_PREFIX/lib.
# Round 4: argv is identical under `mojo run` and `mojo build`, and
#          marrow/parquet/tests/test_codecs.mojo -- which does use
#          `marrow.utils.compression` -- passes alone.  Both hypotheses dead.
# Round 5: stop guessing.  Run every file in the two crashing selections on its
#          own and let the runner name the culprit.  A single aborting case
#          takes the whole shared driver down and reports every case in the
#          selection as failed, so the selection's own output cannot identify
#          it -- only a per-file sweep can.
on:
  push:
    branches: [ci-diag]
  workflow_dispatch:

jobs:
  sweep:
    name: per-file sweep (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dir: [marrow/tests, marrow/parquet/tests, marrow/utils/tests]
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          frozen: true
          environments: dev
      - name: One file at a time
        run: |
          for f in ${{ matrix.dir }}/test_*.mojo; do
            echo "::group::$f"
            if pixi run -e dev pytest -q --no-gpu "$f" > /tmp/out.txt 2>&1; then
              echo "PASS $f -- $(tail -2 /tmp/out.txt | head -1)"
            else
              echo "CRASH-OR-FAIL $f"
              tail -25 /tmp/out.txt
            fi
            echo "::endgroup::"
          done
