name: _diag

# TEMPORARY -- `ci-diag` branch only.
#
# Round 5 named the files: marrow/parquet/tests/test_writer.mojo (fixed: a
# numpy-backed PyArrow buffer failing marrow's 64-byte alignment assert),
# marrow/tests/test_scalars.mojo (segfault) and marrow/tests/test_ipc.mojo
# (hangs -- killed at 1,800 s having produced no output).
#
# Round 6 asks the two remaining ones what they are actually doing: the whole
# error for test_scalars rather than the last 25 lines of it, and, for
# test_ipc, one case at a time so the hang has a name.
on:
  push:
    branches: [ci-diag]
  workflow_dispatch:

jobs:
  scalars:
    name: test_scalars, in full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          frozen: true
          environments: dev
      - run: pixi run -e dev pytest -q --no-gpu marrow/tests/test_scalars.mojo 2>&1 | head -120 || true

  ipc:
    name: test_ipc, one case at a time
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          frozen: true
          environments: dev
      - name: Which case hangs
        run: |
          pixi run -e dev pytest -q --no-gpu --collect-only marrow/tests/test_ipc.mojo \
            | grep '::' > /tmp/cases.txt
          echo "$(wc -l < /tmp/cases.txt) cases"
          while read -r c; do
            start=$SECONDS
            if timeout 400 pixi run -e dev pytest -q --no-gpu --mojo-timeout 300 "$c" > /tmp/o.txt 2>&1; then
              echo "PASS $((SECONDS-start))s $c"
            else
              echo "FAIL $((SECONDS-start))s $c"
              grep -E 'TIMEOUT|Assert|error|crashed' /tmp/o.txt | head -4
            fi
          done < /tmp/cases.txt
