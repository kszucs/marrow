name: _diag

# TEMPORARY -- delete before merging.
#
# Round 1 established: /usr/lib/x86_64-linux-gnu/libm.so exists and libc6-dev is
# installed; a trivial mojo program runs; `marrow/tests/test_dtypes.mojo` alone
# passes in 7 s.  Only the larger `marrow/tests` driver warns
# `could not locate shared library for '-lm'` and then segfaults.  `mojo build`
# works on this runner (build_python, --asan), `mojo run` is what fails -- so the
# question is whether the JIT can be pointed at libm.
on:
  push:
    branches: [ci]
  workflow_dispatch:

jobs:
  linux-jit:
    name: linux jit diag
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          frozen: true
          environments: dev

      # Does anything that actually needs libm reproduce it in seconds?
      - name: A program that needs libm
        run: |
          printf 'from math import sqrt\n\n\ndef main():\n    print(sqrt(2.0))\n' > /tmp/m.mojo
          echo "::group::mojo run, plain"
          pixi run -e dev mojo run /tmp/m.mojo || echo "rc=$?"
          echo "::endgroup::"
          echo "::group::mojo run, LIBRARY_PATH"
          pixi run -e dev bash -c 'LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu mojo run /tmp/m.mojo' || echo "rc=$?"
          echo "::endgroup::"
          echo "::group::mojo build then execute"
          pixi run -e dev mojo build /tmp/m.mojo -o /tmp/m && /tmp/m || echo "rc=$?"
          echo "::endgroup::"

      - name: The selection that crashes, plain
        run: |
          pixi run -e dev pytest -q --no-gpu marrow/tests 2>&1 | tail -12 || true

      - name: The selection that crashes, with LIBRARY_PATH
        run: |
          pixi run -e dev bash -c 'LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu pytest -q --no-gpu marrow/tests' 2>&1 | tail -12 || true
