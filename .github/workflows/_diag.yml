name: _diag

# TEMPORARY -- lives on the `ci-diag` branch only, deleted before merging.
#
# Round 1: /usr/lib/x86_64-linux-gnu/libm.so exists, libc6-dev is installed, a
#          trivial mojo program runs, and marrow/tests/test_dtypes.mojo alone
#          passes in 7 s.  Only the larger `marrow/tests` driver warns
#          `could not locate shared library for '-lm'` and then segfaults.
# Round 2: LIBRARY_PATH makes no difference -- 575 failed either way.  So this
#          is not a linker search path the environment can widen.
# Round 3: two candidate explanations.
#          (a) `mojo run` JIT-links, `mojo build` shells out to a real linker;
#              build_python and --asan both use `mojo build` and both work on
#              this runner.  If test_asan_core passes here, the JIT is the
#              difference and the harness should build.
#          (b) the JIT wants libm inside the environment rather than on the
#              system path.  A symlink settles that in one run.
on:
  push:
    branches: [ci-diag]
  workflow_dispatch:

jobs:
  linux-jit:
    name: linux jit diag
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          frozen: true
          environments: dev

      # (b) -- does the JIT want libm inside CONDA_PREFIX/lib?
      - name: The crashing selection, with libm linked into the env
        run: |
          ln -sfn /lib/x86_64-linux-gnu/libm.so.6 .pixi/envs/dev/lib/libm.so
          ls -l .pixi/envs/dev/lib/libm.so
          pixi run -e dev pytest -q --no-gpu marrow/tests 2>&1 | tail -8 || true
          rm -f .pixi/envs/dev/lib/libm.so

  linux-asan:
    # (a) -- the same layer of the tree, through `mojo build` instead of the JIT.
    name: linux mojo-build path
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          frozen: true
          environments: asan
      - run: pixi run -e asan test_asan_core --no-gpu --no-python 2>&1 | tail -12
