name: Wheels

# The macOS arm64 and manylinux_2_35 x86_64 wheels: scripts/wheel_ci.sh builds
# each with cibuildwheel (`[tool.cibuildwheel]` in python/pyproject.toml),
# checks every bundled library carries its licence, and tests the installed
# wheel. `pixi run -e docker wheel_linux` runs the same script locally.
#
# Manual only until a dispatched run passes both legs; add the `pull_request`
# and `v*` tag triggers in the change that records that run, not before.
#
# Publishing has two locks, and both must open:
#   - the repository variable MODULAR_REDISTRIBUTION_CONFIRMED is 'true' -- set
#     it only once Modular has confirmed in writing that the Mojo runtime
#     libraries in every wheel may be redistributed (NOTICE.txt);
#   - the `pypi` environment's trusted publisher is registered on PyPI, which is
#     deliberately not done until then, so no credential exists before it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # The -O3 libmarrow build peaks near 20 GB; the Linux runner has 16 and
      # the manylinux container shares the host's swap. As in test.yml.
      - name: More swap
        if: runner.os == 'Linux'
        run: |
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build, check and test the wheel
        run: bash scripts/wheel_ci.sh wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  publish:
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && vars.MODULAR_REDISTRIBUTION_CONFIRMED == 'true'
    environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC for the PyPI trusted publisher

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
