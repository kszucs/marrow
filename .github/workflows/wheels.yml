name: Wheels

# Manual only, and unverified.  It last ran on 2026-05-11, when both legs
# failed, and nothing has run it since: it fires on pull requests to main and on
# tags, and there have been none.  Since then `python/build.py` was fixed to
# build `python/bindings/lib.mojo`, which is what the macOS leg died on, so this
# may be closer to working than the last run suggests -- but "may be" is the
# point.  Two things are known to be wrong as of 2026-09-07:
#
#   - `python/pyproject.toml` pinned mojo `1.0.0b2.dev2026051106` in both
#     `[tool.pixi.dependencies]` and the cibuildwheel `before-build`, four
#     months behind the toolchain the tree compiles against.  Corrected in this
#     change, untested.
#   - Both legs install only `mojo-compiler` before building.  `marrow` imports
#     `max.algorithm.*` and `max.gpu.host` unconditionally -- in `buffers.mojo`,
#     `views.mojo`, `arrays.mojo`, `execution.mojo` and more -- so MAX is needed
#     on the search path whether or not GPU codegen is on, and nothing here puts
#     it there.
#   - The Linux leg needs a mojo compiler inside the manylinux container; in
#     2026-05 it could not even pull its image
#     (`No such image: quay.io/pypa/manylinux_2_34_x86_64:2025.06.08-1`), which
#     the cibuildwheel bump below may or may not settle.
#   - The macOS `before-all` now builds `libopendal_c` so the wheel can embed
#     it, and that step has never run here.  Two things about it are guesses:
#     whether cibuildwheel expands `{project}` inside `[tool.cibuildwheel.macos]
#     environment`, and whether the runner's rust is new enough (opendal-c wants
#     >=1.91).  The *mechanism* it feeds is verified -- `pixi run -e wheel wheel`
#     with `MARROW_OPENDAL_LIBRARY` set produces a wheel whose `fs://` reads work
#     with no OpenDAL anywhere in the environment -- so what is unproven is this
#     plumbing, not the result.  The Linux leg deliberately does not build it:
#     the manylinux image has no rust, and a wheel without OpenDAL still reads
#     every local file.
#
# `pixi run -e wheel wheel` builds and tests a macOS wheel locally and is the
# working path today; docs/backlog.md tracks the rest.  Restore the
# `pull_request` and tag triggers in the same change that makes a leg pass on a
# real run, not before.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OIDC for PyPI trusted publisher

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          package-dir: python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  publish:
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
