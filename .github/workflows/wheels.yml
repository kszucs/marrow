name: Wheels

# Builds the macOS arm64 and manylinux x86_64 wheels with cibuildwheel (its
# configuration is `[tool.cibuildwheel]` in python/pyproject.toml), tests each
# installed wheel, and checks every library it bundles carries its licence
# (`python -m devkit wheel check`).
#
# Manual only until a dispatched run passes both legs; add the `pull_request`
# and `v*` tag triggers in the change that records that run, not before. What
# no run has exercised yet: the pip-installed `mojo` finding `max.*` from the
# `max-core` wheel, the codecs and OpenDAL built by scripts/wheel_deps.sh inside
# the manylinux container, and conda-forge's snappy passing auditwheel's GLIBCXX
# policy without its libstdc++. `pixi run -e wheel wheel` is the verified path
# on macOS.
#
# Publishing has two locks, and both must open:
#   - the repository variable MODULAR_REDISTRIBUTION_CONFIRMED is 'true' -- set
#     it only once Modular has confirmed in writing that the Mojo runtime
#     libraries in every wheel may be redistributed (NOTICE.txt);
#   - the `pypi` environment's trusted publisher is registered on PyPI, which is
#     deliberately not done until then, so no credential exists before it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # The -O3 libmarrow build peaks near 20 GB; the Linux runner has 16 and
      # the manylinux container shares the host's swap. As in test.yml.
      - name: More swap
        if: runner.os == 'Linux'
        run: |
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          package-dir: python

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # devkit's CLI imports click, and rich and psutil through its progress
      # display; nothing else, and nothing from marrow.
      - name: Check every bundled library's licence
        run: |
          pip install click rich psutil
          python -m devkit wheel check --require opendal wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  publish:
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && vars.MODULAR_REDISTRIBUTION_CONFIRMED == 'true'
    environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC for the PyPI trusted publisher

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The artifacts are checked again here, where the upload happens.
      - name: Check every bundled library's licence
        run: |
          pip install click rich psutil
          python -m devkit wheel check --require opendal dist/*.whl

      - uses: pypa/gh-action-pypi-publish@release/v1
