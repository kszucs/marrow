name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bench-linux-x86_64:
    name: bench (linux, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_COLOR: "1"
      PYTEST_ADDOPTS: "--color=yes"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Same reason as the Tests workflow: a free Linux runner's 16 GB is not
      # quite enough for the heaviest unit, and /mnt has ~70 GB going spare.
      - name: More swap
        run: |
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          frozen: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Checkout gh-pages
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-out

      # One selection is one compilation unit, and `bench_*.mojo` builds at -O3:
      # all 283 benchmarks in a single `pytest` call was OOM-killed on the free
      # runner 15 minutes into the compile, on every run since 2026-05-11.  The
      # selections below are separate units, so each one fits.  Their results
      # are merged rather than overwritten -- see `BenchmarkHistory`.
      #
      # `marrow/kernels/tests` is split again: its ten `bench_*.mojo` files at
      # -O3 were still one unit and still hit the 1,800 s compile timeout, while
      # the `test_*.mojo` half of the same selection compiled in 659 s.
      #
      # `--benchmark` *adds* the bench files, it does not replace the tests, so
      # naming a directory here compiles and runs that directory's test unit as
      # well -- which is what the Tests workflow is for, and which is how this
      # job came to be re-running `marrow/expr`, the selection that cannot fit a
      # free runner.  Naming the `bench_*` files directly leaves the test unit
      # empty, so this job benchmarks and nothing else.
      - name: Run benchmarks (PR)
        if: github.ref != 'refs/heads/main'
        run: |
          run() { pixi run -e bench pytest --benchmark -v --no-gpu --mojo-timeout 3600 "$@"; }
          run marrow/kernels/tests/bench_a*.mojo marrow/kernels/tests/bench_b*.mojo \
              marrow/kernels/tests/bench_c*.mojo marrow/kernels/tests/bench_f*.mojo
          run marrow/kernels/tests/bench_h*.mojo marrow/kernels/tests/bench_j*.mojo \
              marrow/kernels/tests/bench_so*.mojo marrow/kernels/tests/bench_st*.mojo
          run marrow/tests/bench_*.mojo marrow/utils/tests/bench_*.mojo \
              marrow/parquet/tests/bench_*.mojo marrow/expr/comptime/tests/bench_*.mojo
          run python/marrow/tests/bench_*.py

      - name: Run benchmarks
        if: github.ref == 'refs/heads/main'
        run: |
          save() {
            pixi run -e bench pytest --benchmark -v --no-gpu --mojo-timeout 3600 \
              --save-benchmarks results \
              --benchmark-history gh-pages-out/benchmarks/data.json "$@"
          }
          save marrow/kernels/tests/bench_a*.mojo marrow/kernels/tests/bench_b*.mojo \
               marrow/kernels/tests/bench_c*.mojo marrow/kernels/tests/bench_f*.mojo
          save marrow/kernels/tests/bench_h*.mojo marrow/kernels/tests/bench_j*.mojo \
               marrow/kernels/tests/bench_so*.mojo marrow/kernels/tests/bench_st*.mojo
          save marrow/tests/bench_*.mojo marrow/utils/tests/bench_*.mojo \
               marrow/parquet/tests/bench_*.mojo marrow/expr/comptime/tests/bench_*.mojo
          save python/marrow/tests/bench_*.py

      - name: Prepare dashboard
        if: github.ref == 'refs/heads/main'
        run: |
          COMMIT="$(git rev-parse HEAD)"
          mkdir -p gh-pages-out/results gh-pages-out/benchmarks
          cp results/${COMMIT}.json gh-pages-out/results/${COMMIT}.json
          cp benchmarks/index.html gh-pages-out/benchmarks/index.html

      - uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-out
          keep_files: true
