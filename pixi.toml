[workspace]
authors = ["Krisztian Szucs <szucs.krisztian@gmail.com>"]
channels = [
  "https://prefix.dev/mojo-community",
  "https://conda.modular.com/max-nightly/",
  "conda-forge",
  "https://prefix.dev/pixi-build-backends",
]
# `linux-aarch64` is here so an Apple Silicon machine can run a *native* Linux
# container and reproduce what CI sees on Linux -- glibc, ELF/JIT linking, and
# the allocator alignment that decides whether a foreign buffer import aborts.
# The alternative was emulating linux-64, and Docker's qemu CPU stops at SSE4.2:
# the mojo binary dies with `Illegal instruction` before printing its version.
# Rosetta would supply AVX2 and is the better path when it is switched on.
# Nothing is *shipped* for this platform -- see `Dockerfile.linux`.
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[package]
name = "marrow"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.1.*" }

[package.build-dependencies]
mojo-compiler = "==1.2.0.dev2026092105"
mojo = "==1.2.0.dev2026092105"
mojo-regex = { git = "https://github.com/kszucs/mojo-regex.git", branch = "marrow" }
morrow = { git = "https://github.com/kszucs/morrow.mojo.git", branch = "marrow" }
emberjson = { git = "https://github.com/kszucs/EmberJson.git", branch = "marrow" }

[package.run-dependencies]
# Mojo builds are compiled against a specific CPython minor version; update the
# minor bound together with mojo when upgrading.
python = ">=3.14,<3.15"
# The Parquet page codecs. `dlopen`ed, not linked, so a box without one still
# reads everything the others cover -- but that is a fallback, not a plan, and
# a conda install used to get them only if something else happened to pull
# them in. `libopendal_c` cannot join them: it is `publish = false` upstream
# with no conda package, which is why remote storage stays opt-in.
zstd = ">=1.5.0"
snappy = ">=1.1.0"
lz4-c = ">=1.9.0"
brotli = ">=1.0.9"
zlib = ">=1.3.1"
# Time zones for `marrow/kernels/temporal.mojo`: morrow, from the `marrow`
# branch of a fork that builds on the pinned nightly, reading the IANA tz
# database that `tzdata` installs under `$CONDA_PREFIX/share/zoneinfo`.
morrow = { git = "https://github.com/kszucs/morrow.mojo.git", branch = "marrow" }
tzdata = "*"
# A git source resolves only for a source build; publish the fork to
# mojo-community before a release -- see backlog.md.
mojo-regex = { git = "https://github.com/kszucs/mojo-regex.git", branch = "marrow" }

# One Mojo compile cache for every environment and every worktree. Its entries
# are keyed by the IR being compiled, not by path, so a checkout reuses what
# another built; the per-environment default kept a separate copy in each.
# Nothing evicts entries -- clear it with `mojo --clear-cache`.
[activation.env]
MODULAR_CACHE_DIR = "${MODULAR_CACHE_DIR:-$HOME/.cache/marrow-mojo}"

[tasks]
# The developer CLI, with arguments passed through: `pixi run devkit license check`.
devkit = "python -m devkit"
build_python = { cmd = "python -m devkit build lib --bench" }
# apache/arrow-testing, the `testing` submodule: archery's gold IPC files and
# the inputs that crashed Arrow C++'s fuzzers. Outside a git checkout there is
# nothing to fetch, and what reads it skips instead.
testing_data = { cmd = "git submodule update --init testing || echo 'testing/ not fetched: not a git checkout'" }
profile = "python -m devkit profile"
package = "python -m devkit build package"
publish = { cmd = "find . -name 'marrow-*.conda' | xargs pixi upload https://prefix.dev/api/v1/upload/mojo-community" }
# Builds the same SELECT/WHERE query via the comptime (AOT), hybrid, and
# runtime (type-erased) relational layers, strips each, and compares sizes +
# symbol counts -- see benchmarks/binary_size/README.md.
bench-size = { cmd = "python -m devkit bench size compare" }
# The CI gate: build the recorded gates and fail if any grew past its
# baseline `__text` size. `--update` re-records after an intentional change.
bench-size-check = { cmd = "python -m devkit bench size check" }

# Compiles every Mojo snippet the docs include, so the guides cannot rot.
# Quarto executes the docs' Python cells at render time, which keeps that half
# honest; Mojo has no such engine, and this stands in for it. Judged by grep,
# not by exit status -- `mojo build` reports a parse failure and still exits 0.
docs_check = { cmd = "python -m devkit docs check" }

# Dev — dependencies and tasks for development and testing.
[feature.dev.dependencies]
pytest = ">=9.0.2,<10"
# `<5.3`, not `<6`: `devkit/benches.py` constructs a `BenchmarkFixture` directly,
# with pytest-benchmark's own keyword API, and 5.3.0 added required arguments to
# that constructor -- every benchmark then fails with
# `BenchmarkFixture.__init__() missing 2 required positional arguments` before
# anything is compiled. The old `<6` bound was satisfied by both, so which one
# you got depended on the solve: adding `linux-aarch64` picked 5.3.0 there and
# 5.2.3 everywhere else. Raise this in the same change that updates the fixture
# construction.
pytest-benchmark = ">=5.2.3,<5.3"
pytest-xdist = ">=3,<4"
# XXH64 oracle for `marrow/utils/tests/test_hashing.mojo`. The Parquet spec
# mandates this exact hash for bloom filters, so the tests check marrow against
# a real independent implementation rather than against vectors transcribed by
# hand. There is no equivalent package for rapidhash; see that file for how it
# is pinned instead.
python-xxhash = ">=3.7.0,<4"
# Avro oracle for `python/marrow/tests/test_avro.py`: every file marrow writes
# is read back by an independent implementation, and files it writes are read
# by marrow, so a mistake mirrored in marrow's encoder and decoder cannot pass.
fastavro = ">=1.12,<2"
# fastavro's snappy codec; its zstandard one uses Python's `compression.zstd`.
cramjam = ">=2.11,<3"
# Property-based differential tests against PyArrow:
# `python/marrow/tests/test_properties_*.py`.
hypothesis = ">=6,<7"

[feature.dev.pypi-dependencies]
# PyPI wheel is used instead of conda-forge: the conda-forge libarrow bundles
# libopentelemetry-cpp whose RuntimeContextStorage singleton destructor crashes
# at process exit on macOS, corrupting stdout and causing all tests in the
# same binary to be reported as failed.  The PyPI wheel ships a
# self-contained libarrow built without the OpenTelemetry SDK.
pyarrow = ">=23.0.1,<24"
numpy = ">=2.4.4, <3"
cffi = "*"

[feature.dev.tasks]
# Build-only check — compiles every module under `marrow/`, tests and benches
# included (they live in `marrow/**/tests/` and are ordinary importable modules
# now, with no `main()`).  It reports all errors and warnings in one pass, so
# prefer it over pytest while migrating to a new Mojo release: pytest has to
# elaborate the whole library before it can report anything.
#
#   precompile                          — everything under marrow/, ~18s
#
# A single test file cannot be compiled on its own any more — without a
# `main()` there is nothing to build.  Run it through pytest instead; the
# harness generates a driver for the selection and compiles that.
#
# The artifact goes to `.precompile/`, NOT `.test_runners/`.  Mojo adds a source
# file's own directory to the import search path, and the generated test driver
# lives in `.test_runners/` — so an artifact left there shadows the whole
# `marrow/` source tree for every subsequent pytest run, which then resolves
# imports against the stale package instead of the files you just edited.  Only
# the diagnostics matter here; the artifact itself is never consumed.
precompile = { cmd = "python -m devkit build precompile" }
# The devkit suite — flag handling, driver generation, result mapping, the
# golden case format, the size gate.  No Mojo compilation; about a second.
selftest = { cmd = "pytest devkit/tests -q" }
# The comptime lane against the runtime lane: see docs/reference/comptime.qmd.
bench-comptime = { cmd = "pytest marrow/expr/tests/bench_comptime.mojo --competition-winner comptime --competition-json docs/data/comptime.json" }
# marrow's thread pool against MAX's `sync_parallelize`, per operation.
bench-threads = { cmd = "pytest marrow/utils/tests/bench_threads.mojo --benchmark --competition" }
# The thread pool's benchmarks at each commit: `pixi run -e dev
# bench-threads-history main HEAD`. The `max` rows are the control, since no
# change to the pool can move them.
bench-threads-history = { cmd = "python -m devkit bench history --file marrow/utils/tests/bench_threads.mojo -k bench_" }
# The same benchmarks across commits, each commit a contender:
# `pixi run -e dev bench-history HEAD~5 HEAD`.
bench-history = { cmd = "python -m devkit bench history" }
# How much of the golden corpus the SQL front end answers, and what the
# declined cases trip over -- the list to work down when widening the grammar.
golden_sql = { cmd = "python -m devkit golden sql", depends-on = ["build_python"] }
test_mojo = { cmd = "pytest --mojo -v" }
test_python = { cmd = "pytest --python -v", depends-on = ["testing_data"] }
test_gpu = { cmd = "pytest --gpu -v" }
# The thread pool, and `ExecContext` dispatching through it, under
# ThreadSanitizer. Mojo's driver finds the TSAN runtime itself (Xcode's clang
# on macOS); `MARROW_TSAN` swaps Mojo's tcmalloc, which TSAN cannot follow,
# for libc's allocator. A race report fails the case whose stack names it;
# `--repeat N` runs the build N times.
test_tsan = { cmd = "pytest --mojo --tsan -v marrow/utils/tests/test_threads.mojo marrow/kernels/tests/test_execution.mojo" }
# The thread pool, and `ExecContext` dispatching through it, once.
test_threads = { cmd = "pytest --mojo -v marrow/utils/tests/test_threads.mojo marrow/kernels/tests/test_execution.mojo" }
# The thread pool's suite built once and run in 30 fresh processes, each soak
# loop 50x longer — a few minutes, for the race that shows once in a hundred
# runs.
test_threads_stress = { cmd = "pytest --mojo -v --repeat 30 --define MARROW_THREADS_STRESS=50 marrow/utils/tests/test_threads.mojo" }
test = { cmd = "pytest -v", depends-on = ["testing_data"] }
# The exact hash consumers — group-by and join — with a 6-bit key hash, so
# nearly every probe meets a colliding key and a hash-only answer would be
# wrong (`KeyHash` in marrow/utils/hashing.mojo). Mojo lanes only:
# `libmarrow.so` is built without defines. Three runs, not one: together they
# are one compilation unit that can outlast the harness's 30-minute timeout.
test_collisions = { cmd = "pytest --mojo -v --define MARROW_HASH_BITS=6 marrow/kernels/tests && pytest --mojo -v --define MARROW_HASH_BITS=6 marrow/expr/tests && pytest --mojo -v --define MARROW_HASH_BITS=6 golden" }
# Compiles every fuzz harness and replays the committed corpus against its
# recorded verdicts; `fuzz-replay-asan` in `asan` also runs the entries only a
# sanitizer catches. Fuzzing itself is the `fuzz` environment's.
fuzz-replay = { cmd = "pytest -v fuzz", depends-on = ["testing_data"] }
# One selection = one compilation unit, so there is nothing for xdist to
# parallelise across: splitting by file would rebuild the same unit per worker.
# Narrow the selection instead (a directory, a file) — that shrinks the unit.

# Integration — Arrow protocol conformance tests via archery.
# All reference Arrow implementations are cloned into ./integration/arrow/ and
# built locally so the integration suite is self-contained inside the pixi env.
[feature.integration.dependencies]
git = "*"
rust = ">=1.80"
go = ">=1.22"
cmake = ">=3.20"
ninja = "*"
cxx-compiler = "*"
# C++ Arrow build deps (used via ARROW_DEPENDENCY_SOURCE=AUTO)
# Boost is pinned below 1.88: Arrow C++ needs explicit per-release support for
# Boost.Process (apache/arrow#43746 for 1.86, #45121 for 1.87), and the
# apache-arrow-24.0.0 tree cloned below predates conda-forge's current 1.91.
# Against 1.91 the build got as far as linking and then failed with
# `libarrow_testing.so: undefined reference to boost::process::v2::...` and
# boost::filesystem, taking the integration job down on every run.  Raise this
# together with the `clone_arrow` tag, not on its own.
libboost-devel = ">=1.86,<1.88"
gflags = "*"
flatbuffers = "*"
xsimd = "*"
rapidjson = "*"

[feature.integration.tasks]
# Clone reference implementations directly into the apache/arrow tree layout
# the orchestrator scripts (rust_build.sh, integration_arrow_build.sh) expect.
clone_arrow = { cmd = "test -d integration/arrow || git clone --depth 1 --branch apache-arrow-24.0.0 https://github.com/apache/arrow.git integration/arrow" }
clone_arrow_rs = { cmd = "test -d integration/arrow/rust || git clone --depth 1 --branch 58.2.0 https://github.com/apache/arrow-rs.git integration/arrow/rust", depends-on = ["clone_arrow"] }
clone_arrow_go = { cmd = "test -d integration/arrow/go || git clone --depth 1 --branch v18.6.0 https://github.com/apache/arrow-go.git integration/arrow/go", depends-on = ["clone_arrow"] }
# archery is not on PyPI; install from the cloned apache/arrow tree into the
# active pixi env.  Must run after clone_arrow so the source tree exists.
install_archery = { cmd = "test -d integration/arrow/dev/archery", depends-on = ["clone_arrow"] }

# Build all reference implementations via apache/arrow's official orchestrator.
# Env mirrors ci/docker/conda-integration.dockerfile, minus features we don't need.
# `CONDA_PREFIX=` clears pixi's auto-set value: arrow's cpp_build.sh treats a
# non-empty CONDA_PREFIX as a signal to invoke `conda list` for diagnostics, and
# pixi does not ship a `conda` binary.  Pixi's task schema rejects empty-string
# env values, so the unset is done inline at the start of the cmd.
#
# `LDFLAGS` has to name the environment's lib directory explicitly, and that is
# a consequence of the line above: clearing CONDA_PREFIX also loses the search
# path the conda compiler activation would have contributed.  `libarrow_testing`
# records a DT_NEEDED on `libboost_filesystem.so.1.87.0`, and linking
# `arrow-json-integration-test` against it then failed with
# `not found (try using -rpath or -rpath-link)` followed by a screen of
# undefined `boost::filesystem` and `boost::process::v2` references.
build_arrow = { cmd = "CONDA_PREFIX= integration/arrow/ci/scripts/integration_arrow_build.sh $PIXI_PROJECT_ROOT/integration/arrow $PIXI_PROJECT_ROOT/integration/arrow/build", depends-on = [
  "clone_arrow_rs",
  "clone_arrow_go",
], env = { ARCHERY_INTEGRATION_WITH_RUST = "1", ARCHERY_INTEGRATION_WITH_GO = "1", ARCHERY_INTEGRATION_WITH_NANOARROW = "0", ARCHERY_INTEGRATION_WITH_DOTNET = "0", ARCHERY_INTEGRATION_WITH_JAVA = "0", ARCHERY_INTEGRATION_WITH_JS = "0", ARCHERY_INTEGRATION_WITH_RUBY = "0", ARROW_INTEGRATION_CPP = "ON", ARROW_BUILD_INTEGRATION = "ON", ARROW_BUILD_STATIC = "OFF", ARROW_BUILD_TESTS = "OFF", ARROW_BUILD_TYPE = "release", ARROW_USE_CCACHE = "OFF", ARROW_DEPENDENCY_SOURCE = "AUTO", ARROW_HDFS = "OFF", ARROW_MIMALLOC = "OFF", ARROW_WITH_UTF8PROC = "OFF", CMAKE_UNITY_BUILD = "ON", ARROW_ACERO = "OFF", ARROW_AZURE = "OFF", ARROW_COMPUTE = "OFF", ARROW_CSV = "OFF", ARROW_DATASET = "OFF", ARROW_FILESYSTEM = "OFF", ARROW_FLIGHT = "OFF", ARROW_FLIGHT_SQL = "OFF", ARROW_GANDIVA = "OFF", ARROW_GCS = "OFF", ARROW_JEMALLOC = "OFF", ARROW_JSON = "OFF", ARROW_ORC = "OFF", ARROW_PARQUET = "OFF", ARROW_S3 = "OFF", ARROW_SUBSTRAIT = "OFF", ARROW_USE_GLOG = "OFF", ARROW_WITH_BROTLI = "OFF", ARROW_WITH_BZ2 = "OFF", ARROW_WITH_LZ4 = "OFF", ARROW_WITH_SNAPPY = "OFF", ARROW_WITH_ZLIB = "OFF", ARROW_WITH_ZSTD = "OFF", GOBIN = "$PIXI_PROJECT_ROOT/integration/arrow/go/bin", ARROW_HOME = "$PIXI_PROJECT_ROOT/integration/arrow/install", LDFLAGS = "-L$PIXI_PROJECT_ROOT/.pixi/envs/integration/lib -Wl,-rpath,$PIXI_PROJECT_ROOT/.pixi/envs/integration/lib -Wl,-rpath-link,$PIXI_PROJECT_ROOT/.pixi/envs/integration/lib" } }

# --- run all integration tests ---
integration = { cmd = "python -m devkit integration run --run-ipc --run-c-data --with-rust --with-go --with-cpp", depends-on = [
  "testing_data",
  "build_python",
  "install_archery",
  "build_arrow",
], env = { PYTHONPATH = "python:integration/arrow/dev/archery", ARROW_ROOT = "$PIXI_PROJECT_ROOT/integration/arrow", ARROW_RUST_EXE_PATH = "$PIXI_PROJECT_ROOT/integration/arrow/build/rust/debug", ARROW_CPP_EXE_PATH = "$PIXI_PROJECT_ROOT/integration/arrow/build/cpp/release", GOBIN = "$PIXI_PROJECT_ROOT/integration/arrow/go/bin", DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/integration/arrow/build/cpp/release", LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/integration/arrow/build/cpp/release" } }

# Asan — ASAN runtime needed for --asan test runs.
[feature.asan.dependencies]
libcompiler-rt = ">=17,<23"

[feature.asan.tasks]
# The whole suite under ASAN, as one compilation unit.  Local deep runs only:
# measured 2026-08-13 it exceeds the 1800s `--mojo-timeout` and peaks at 36.4 GB,
# because `--asan` links a real binary (`mojo build`, not `mojo run`) and one
# selection is one unit.  CI runs the same cases split into the `test` job's
# selections -- the `asan` job in `test.yml`.
test_mojo_asan = { cmd = "pytest --mojo --asan -v" }
# The thread pool, and `ExecContext` dispatching through it, under ASAN with
# LeakSanitizer: any memory still allocated at exit fails the run.
test_threads_asan = { cmd = "pytest --mojo --asan --leaks -v marrow/utils/tests/test_threads.mojo marrow/kernels/tests/test_execution.mojo" }
# The fuzz corpus replayed under ASAN, entries marked `sanitizer` included.
fuzz-replay-asan = { cmd = "pytest -v --asan fuzz", depends-on = ["testing_data"] }

# Fuzz — coverage-guided fuzzing with libFuzzer. `mojo build` has no coverage
# flag, so a harness is emitted as LLVM bitcode and clang instruments and links
# it. That clang has to read the bitcode Mojo writes, so it tracks Mojo's LLVM
# rather than the `asan` pin above -- and so lives in its own solve group,
# which keeps the two compiler-rt lines from constraining each other.
[feature.fuzz.dependencies]
clang = ">=23"
compiler-rt = ">=23"

# conda-forge's clang links against its own sysroot, which defaults to glibc
# 2.28; the Mojo runtime libraries need symbols from 2.34. Not newer: a fuzzer
# linked against a newer sysroot than the host's glibc does not start.
[feature.fuzz.target.linux-64.dependencies]
sysroot_linux-64 = "2.34.*"

[feature.fuzz.target.linux-aarch64.dependencies]
sysroot_linux-aarch64 = "2.34.*"

[feature.fuzz.tasks]
# `pixi run -e fuzz fuzz-run ipc_stream --time 120`; `devkit fuzz --help` has
# the rest. The replay of the committed corpus needs none of this -- it is a
# plain `mojo build` and runs in `dev`, as `pytest fuzz`.
fuzz-build = { cmd = "python -m devkit fuzz build" }
fuzz-run = { cmd = "python -m devkit fuzz run" }

# Bench — benchmark dependencies and tasks (polars/duckdb for comparison benches).
[feature.bench.dependencies]
polars = ">=1.39.2,<2"
duckdb = ">=1.5.1,<2"

[feature.bench.tasks]
# Recompute every golden expectation from DuckDB, which only this feature has.
golden_regenerate = { cmd = "python -m devkit golden regenerate" }
bench = { cmd = "pytest --benchmark -v" }
bench-mojo = { cmd = "pytest --benchmark --mojo -v" }
bench-python = { cmd = "pytest --benchmark --python -v" }
# marrow against pyarrow, polars, duckdb and numpy, side by side.
bench-engines = { cmd = "pytest --benchmark --python --competition -v" }

# Format — code formatting and linting.
[feature.format.dependencies]
ruff = ">=0.14.14,<0.15"

[feature.format.tasks]
fmt_mojo = { cmd = "mojo format marrow python benchmarks fuzz golden/cases golden/helpers.mojo" }
fmt_python = { cmd = "ruff format devkit python conftest.py benchmarks fuzz golden" }
# Adds the Apache-2.0 header wherever it is missing, so `fmt_check` -- the lint
# job -- fails on a file committed without one.
fmt_license = { cmd = "python -m devkit license fix" }
fmt = { depends-on = ["fmt_license", "fmt_mojo", "fmt_python"] }
fmt_check = { cmd = "git diff --exit-code", depends-on = ["fmt"] }

# Docs — documentation generation.
[feature.docs.dependencies]
ipython = ">=9.11.0,<10"
jupyter = ">=1.1,<2"
jupyter-cache = ">=1.0,<2"
quarto = ">=1.6,<2"

# The interop pages execute real PyArrow round-trips, so the docs environment
# needs it too. Same PyPI-wheel reasoning as `feature.dev` above.
[feature.docs.pypi-dependencies]
pyarrow = ">=23.0.1,<24"

[feature.docs.tasks]
docs = { cmd = "quarto render docs/", depends-on = [
  "build_python",
], env = { PYTHONPATH = "python" } }
docs_preview = { cmd = "quarto preview docs/", depends-on = [
  "build_python",
], env = { PYTHONPATH = "python" } }

# Examples — optional runnable examples.
# Run with: pixi run -e examples datafusion_udf
[feature.examples.pypi-dependencies]
datafusion = ">=44.0.0"

[feature.examples.tasks]
datafusion_udf = { cmd = "python examples/datafusion/main.py", depends-on = [
  "build_python",
], env = { PYTHONPATH = "python" } }

# Docker — x86_64 Linux container for reproducing CI failures locally.
# Anything after the task name is passed to pytest, so a selection works the
# same as it does on the host:
#
#   pixi run -e docker test_arm64 marrow/tests/test_ipc.mojo
#
# `arm64` is native on Apple Silicon and is the loop that found the IPC
# dictionary deadlock; `x86` is the platform CI runs and needs Rosetta on a Mac.
# See Dockerfile.linux.
[feature.docker.tasks]
build_x86 = { cmd = "docker compose build x86" }
build_arm64 = { cmd = "docker compose build arm64" }
test_x86 = { cmd = "docker compose run --rm x86 pixi run -e dev pytest", depends-on = ["build_x86"] }
test_arm64 = { cmd = "docker compose run --rm arm64 pixi run -e dev pytest", depends-on = ["build_arm64"] }

# Wheel — local wheel building for macOS development.
[feature.wheel.dependencies]
hatchling = ">=1.25,<2"
delocate = ">=0.11,<1"
pytest = ">=9.0.2,<10"
pip = "*"

[feature.wheel.pypi-dependencies]
pyarrow = ">=23.0.1,<24"
numpy = ">=2.4.4,<3"

[feature.wheel.tasks]
wheel_build = { cmd = "strip -x python/marrow/libmarrow.so && (cd python && python -m hatchling build --target wheel) && delocate-wheel -w dist/repaired/ -v python/dist/marrow-*.whl", depends-on = ["build_python"] }
wheel_install = { cmd = "python -m pip install -q --force-reinstall --no-deps dist/repaired/marrow-*.whl", depends-on = ["wheel_build"] }
wheel_import = { cmd = "python -c 'import marrow; print(marrow.__file__)'", depends-on = ["wheel_install"] }
wheel_test = { cmd = "pytest python/marrow/tests/test_*.py -v --noconftest -m 'not gpu'", depends-on = ["wheel_install"] }
wheel = { depends-on = ["wheel_import", "wheel_test"] }

# Object store — builds Apache OpenDAL's C binding and runs the storage tests
# against it. Separate from `dev` on purpose: `rust` pulls ~400 crates, and
# nothing in the default environment needs it. `libopendal_c` is `publish =
# false` upstream with no conda build, so this is the only way to get one.
[feature.opendal.dependencies]
rust = ">=1.91"   # opendal-c's rust-version
git = "*"
cmake = "*"       # aws-lc-rs, pulled in by the default rustls transport

[feature.opendal.tasks]
# The clone tag and the cargo feature list live in the script, not here: the
# wheel build needs the same two and a second copy that drifts is a silently
# corrupt ABI mirror rather than a build failure. See the comment there.
clone_opendal = "scripts/build_opendal_c.sh clone"
build_opendal = "scripts/build_opendal_c.sh"
# MARROW_REQUIRE_OPENDAL turns "library absent" from a silent skip into a
# failure -- without it a suite that tests nothing looks exactly like one that
# passes.
test_opendal = { cmd = "MARROW_REQUIRE_OPENDAL=1 pytest -v marrow/io/tests marrow/utils/tests/test_utils_uri.mojo", depends-on = [
  "build_opendal",
] }
# Lives here rather than under `examples` because it is the one example that
# needs `libopendal_c` -- it queries a Parquet file over HTTPS. It also needs
# the network, so it is not wired into any test task.
huggingface = { cmd = "python examples/huggingface/main.py", depends-on = [
  "build_python",
  "build_opendal",
], env = { PYTHONPATH = "python" } }

[feature.opendal.target.osx.activation.env]
MARROW_OPENDAL_LIBRARY = "$PIXI_PROJECT_ROOT/vendor/opendal/bindings/c/target/release/libopendal_c.dylib"

[feature.opendal.target.linux.activation.env]
MARROW_OPENDAL_LIBRARY = "$PIXI_PROJECT_ROOT/vendor/opendal/bindings/c/target/release/libopendal_c.so"

[environments]
default = { features = ["dev", "format"], solve-group = "default" }
dev = { features = ["dev", "format"], solve-group = "default" }
asan = { features = ["dev", "asan"], solve-group = "default" }
bench = { features = ["dev", "bench"], solve-group = "default" }
fuzz = { features = ["dev", "fuzz"], solve-group = "fuzz" }
format = { features = ["format"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
examples = { features = ["examples"], solve-group = "default" }
integration = { features = ["dev", "integration"], solve-group = "integration" }
opendal = { features = ["dev", "opendal"], solve-group = "opendal" }
docker = { features = ["docker"], no-default-feature = true }
wheel = { features = ["wheel"], solve-group = "default" }

[dependencies]
mojo = ">=1.2.0.dev2026092105,<2"
# MAX is a hard dependency, in two independent ways:
#
#  1. Since mojo 1.0.0b3.dev2026072406, GPU codegen resolves `max.package_root`
#     and hard-errors ("please install MAX for accelerator support") when
#     `lib/libmax.dylib` is absent — which trips any build on a machine
#     reporting an accelerator, since `has_accelerator()` is
#     `is_gpu() or _accelerator_arch() != ""`.
#  2. Since mojo 1.0.0, `DeviceContext`/`DeviceBuffer`/`HostBuffer` live in the
#     `max.gpu.host` *Mojo* package, not `std.gpu.host`, so the import itself
#     needs MAX on the search path.
#
# (1) alone was once considered a toolchain regression worth retrying without
# the pin; (2) makes that moot — do not drop it.  MAX uses its own version
# line; upstream pins the pair together (mojo 1.2.0.dev ↔ max 26.7.0.dev).
max = "==26.7.0.dev2026092105"
# The regex engine behind `marrow/kernels/regex.mojo`: a fork of
# msaelices/mojo-regex whose `marrow` branch builds on the pinned nightly.
# It installs `lib/mojo/regex.mojoc`, which mojo finds with no `-I`.
mojo-regex = { git = "https://github.com/kszucs/mojo-regex.git", branch = "marrow" }
# Time zones for `marrow/kernels/temporal.mojo`: morrow, from the `marrow`
# branch of a fork that builds on the pinned nightly, reading the IANA tz
# database that `tzdata` installs under `$CONDA_PREFIX/share/zoneinfo`.
morrow = { git = "https://github.com/kszucs/morrow.mojo.git", branch = "marrow" }
tzdata = "*"
# The JSON tokenizer behind `marrow/json/`: a fork of bgreni/EmberJson whose
# `marrow` branch builds on the pinned nightly. It installs
# `lib/mojo/emberjson.mojoc` (with its `emberserde`).
emberjson = { git = "https://github.com/kszucs/EmberJson.git", branch = "marrow" }
# Mojo builds are compiled against a specific CPython minor version; update the
# minor bound together with mojo when upgrading.
python = ">=3.14,<3.15"
# `devkit`, the developer tooling behind every task: click is its CLI, rich its
# progress display and tables, psutil the compiler's resident-size sampler.
# Declared here rather than under `dev` because `build_python`, `package` and
# `profile` are root tasks, and `docs`, `examples` and `wheel` all reach devkit
# through `build_python`.  All three were already installed in every
# environment as transitive dependencies, so this changes no solve -- it stops
# that being an accident, which is how `rich` came to be imported from
# environments that never declared it.
click = ">=8,<9"
rich = ">=13,<15"
psutil = ">=5,<8"
# The mojo-community channel ships a zlib 0.1.0 stub that satisfies no real
# version constraint; pin to the real conda-forge zlib so that pyarrow's
# libopentelemetry-cpp → prometheus-cpp → zlib chain can resolve on linux-64.
zlib = ">=1.3.1"
# Native Parquet page compression codecs, opened at runtime via dlopen by
# marrow/parquet/compression.mojo (no link-time dependency).
zstd = ">=1.5.0"
snappy = ">=1.1.0"
lz4-c = ">=1.9.0"
brotli = ">=1.0.9"
