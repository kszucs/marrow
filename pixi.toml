[workspace]
authors = ["Krisztian Szucs <szucs.krisztian@gmail.com>"]
channels = [
  "https://prefix.dev/mojo-community",
  "https://conda.modular.com/max-nightly/",
  "conda-forge",
  "https://prefix.dev/pixi-build-backends",
]
platforms = ["osx-arm64", "linux-64"]
preview = ["pixi-build"]

[package]
name = "marrow"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.1.*" }

[package.build-dependencies]
mojo-compiler = "==1.0.0b2.dev2026050306"
mojo = "==1.0.0b2.dev2026050306"
pontoneer = { git = "https://github.com/kszucs/pontoneer", tag = "v0.6.6+mojo1.0.0b2.dev2026050306" }

[package.run-dependencies]
# Mojo nightly builds are compiled against a specific CPython minor version;
# update the minor bound together with mojo/pontoneer when upgrading.
python = ">=3.14,<3.15"

[tasks]
build_python = { cmd = "mojo build -I . python/lib.mojo --emit shared-lib -o python/marrow.so" }
profile = "python scripts/profile.py"
package = "mkdir -p package && mojo package marrow -o package/marrow.mojopkg"
publish = { cmd = "find . -name 'marrow-*.conda' | xargs pixi upload https://prefix.dev/api/v1/upload/mojo-community" }

# Dev — dependencies and tasks for development and testing.
[feature.dev.dependencies]
pytest = ">=9.0.2,<10"
pytest-benchmark = ">=5.2.3,<6"
pytest-xdist = ">=3,<4"

[feature.dev.pypi-dependencies]
# PyPI wheel is used instead of conda-forge: the conda-forge libarrow bundles
# libopentelemetry-cpp whose RuntimeContextStorage singleton destructor crashes
# at process exit on macOS, corrupting stdout and causing all tests in the
# same binary to be reported as failed.  The PyPI wheel ships a
# self-contained libarrow built without the OpenTelemetry SDK.
pyarrow = ">=23.0.1,<24"
numpy = ">=2.4.4, <3"
cffi = "*"

[feature.dev.tasks]
test_mojo = { cmd = "pytest --mojo -v" }
test_mojo_parallel = { cmd = "pytest --mojo -v -n auto --dist=loadfile" }
test_python = { cmd = "pytest --python -v" }
test_gpu = { cmd = "pytest --gpu -v" }
test = { cmd = "pytest -v" }
test_parallel = { cmd = "pytest -v -n auto --dist=loadfile" }

# Integration — Arrow protocol conformance tests via archery.
# All reference Arrow implementations are cloned into ./integration/arrow/ and
# built locally so the integration suite is self-contained inside the pixi env.
[feature.integration.dependencies]
git = "*"
rust = ">=1.80"
go = ">=1.22"
cmake = ">=3.20"
ninja = "*"
cxx-compiler = "*"
# C++ Arrow build deps (used via ARROW_DEPENDENCY_SOURCE=AUTO)
libboost-devel = "*"
gflags = "*"
flatbuffers = "*"
xsimd = "*"
rapidjson = "*"

[feature.integration.pypi-dependencies]
# archery lives in the cloned apache/arrow tree (see clone_arrow); reusing it
# avoids a redundant git fetch and keeps the version in sync with the rest of
# the integration scripts we invoke.
archery = { path = "integration/arrow/dev/archery", editable = true }

[feature.integration.tasks]
# Clone reference implementations directly into the apache/arrow tree layout
# the orchestrator scripts (rust_build.sh, integration_arrow_build.sh) expect.
clone_arrow = { cmd = "test -d integration/arrow || git clone --depth 1 https://github.com/apache/arrow.git integration/arrow" }
clone_arrow_rs = { cmd = "test -d integration/arrow/rust || git clone --depth 1 https://github.com/apache/arrow-rs.git integration/arrow/rust", depends-on = ["clone_arrow"] }
clone_arrow_go = { cmd = "test -d integration/arrow/go || git clone --depth 1 https://github.com/apache/arrow-go.git integration/arrow/go", depends-on = ["clone_arrow"] }

# Build all reference implementations via apache/arrow's official orchestrator.
# Env mirrors ci/docker/conda-integration.dockerfile, minus features we don't need.
# `CONDA_PREFIX=` clears pixi's auto-set value: arrow's cpp_build.sh treats a
# non-empty CONDA_PREFIX as a signal to invoke `conda list` for diagnostics, and
# pixi does not ship a `conda` binary.  Pixi's task schema rejects empty-string
# env values, so the unset is done inline at the start of the cmd.
build_arrow = { cmd = "CONDA_PREFIX= integration/arrow/ci/scripts/integration_arrow_build.sh $PIXI_PROJECT_ROOT/integration/arrow $PIXI_PROJECT_ROOT/integration/arrow/build", depends-on = [
  "clone_arrow_rs",
  "clone_arrow_go",
], env = { ARCHERY_INTEGRATION_WITH_RUST = "1", ARCHERY_INTEGRATION_WITH_GO = "1", ARCHERY_INTEGRATION_WITH_NANOARROW = "0", ARCHERY_INTEGRATION_WITH_DOTNET = "0", ARCHERY_INTEGRATION_WITH_JAVA = "0", ARCHERY_INTEGRATION_WITH_JS = "0", ARROW_INTEGRATION_CPP = "ON", ARROW_BUILD_INTEGRATION = "ON", ARROW_BUILD_STATIC = "OFF", ARROW_BUILD_TESTS = "OFF", ARROW_BUILD_TYPE = "release", ARROW_USE_CCACHE = "OFF", ARROW_DEPENDENCY_SOURCE = "AUTO", ARROW_HDFS = "OFF", ARROW_MIMALLOC = "OFF", ARROW_WITH_UTF8PROC = "OFF", CMAKE_UNITY_BUILD = "ON", ARROW_ACERO = "OFF", ARROW_AZURE = "OFF", ARROW_COMPUTE = "OFF", ARROW_CSV = "OFF", ARROW_DATASET = "OFF", ARROW_FILESYSTEM = "OFF", ARROW_FLIGHT = "OFF", ARROW_FLIGHT_SQL = "OFF", ARROW_GANDIVA = "OFF", ARROW_GCS = "OFF", ARROW_JEMALLOC = "OFF", ARROW_JSON = "OFF", ARROW_ORC = "OFF", ARROW_PARQUET = "OFF", ARROW_S3 = "OFF", ARROW_SUBSTRAIT = "OFF", ARROW_USE_GLOG = "OFF", ARROW_WITH_BROTLI = "OFF", ARROW_WITH_BZ2 = "OFF", ARROW_WITH_LZ4 = "OFF", ARROW_WITH_SNAPPY = "OFF", ARROW_WITH_ZLIB = "OFF", ARROW_WITH_ZSTD = "OFF", GOBIN = "$PIXI_PROJECT_ROOT/integration/arrow/go/bin", ARROW_HOME = "$PIXI_PROJECT_ROOT/integration/arrow/install" } }

# --- run all integration tests ---
integration = { cmd = "python -m integration.run --run-ipc --run-c-data --with-rust --with-go --with-cpp", depends-on = [
  "build_python",
], env = { PYTHONPATH = "python", ARROW_ROOT = "$PIXI_PROJECT_ROOT/integration/arrow", ARROW_RUST_EXE_PATH = "$PIXI_PROJECT_ROOT/integration/arrow/build/rust/debug", ARROW_CPP_EXE_PATH = "$PIXI_PROJECT_ROOT/integration/arrow/build/cpp/release", GOBIN = "$PIXI_PROJECT_ROOT/integration/arrow/go/bin", DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/integration/arrow/build/cpp/release", LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/integration/arrow/build/cpp/release" } }

# Asan — ASAN runtime needed for --asan test runs.
[feature.asan.dependencies]
libcompiler-rt = ">=17,<23"

[feature.asan.tasks]
test_mojo_asan = { cmd = "pytest --mojo --asan -v" }
test_mojo_asan_parallel = { cmd = "pytest --mojo --asan -v -n auto --dist=loadfile" }

# Bench — benchmark dependencies and tasks (polars/duckdb for comparison benches).
[feature.bench.dependencies]
polars = ">=1.39.2,<2"
rich = ">=13,<15"
duckdb = ">=1.5.1,<2"

[feature.bench.tasks]
bench_mojo = { cmd = "pytest --benchmark --mojo -v" }
bench_python = { cmd = "pytest --benchmark --python -v" }
bench = { cmd = "pytest --benchmark -v" }

# Format — code formatting and linting.
[feature.format.dependencies]
ruff = ">=0.14.14,<0.15"

[feature.format.tasks]
fmt_mojo = { cmd = "mojo format marrow python" }
fmt_python = { cmd = "ruff format python" }
fmt = { depends-on = ["fmt_mojo", "fmt_python"] }
fmt_check = { cmd = "git diff --exit-code", depends-on = ["fmt"] }

# Docs — documentation generation.
[feature.docs.dependencies]
ipython = ">=9.11.0,<10"
jupyter = ">=1.1,<2"
jupyter-cache = ">=1.0,<2"
quarto = ">=1.6,<2"

[feature.docs.tasks]
docs = { cmd = "quarto render docs/", depends-on = [
  "build_python",
], env = { PYTHONPATH = "python" } }
docs_preview = { cmd = "quarto preview docs/", depends-on = [
  "build_python",
], env = { PYTHONPATH = "python" } }

# Examples — optional runnable examples.
# Run with: pixi run -e examples datafusion_udf
[feature.examples.pypi-dependencies]
datafusion = ">=44.0.0"

[feature.examples.tasks]
datafusion_udf = { cmd = "python examples/datafusion/main.py", depends-on = [
  "build_python",
], env = { PYTHONPATH = "python" } }

[environments]
default = { features = ["dev", "format"], solve-group = "default" }
dev = { features = ["dev", "format"], solve-group = "default" }
asan = { features = ["dev", "asan"], solve-group = "default" }
bench = { features = ["dev", "bench"], solve-group = "default" }
format = { features = ["format"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
examples = { features = ["examples"], solve-group = "default" }
integration = { features = ["dev", "integration"], solve-group = "default" }

[dependencies]
mojo = ">=1.0.0b2.dev2026050306,<2"
pontoneer = { git = "https://github.com/kszucs/pontoneer", tag = "v0.6.6+mojo1.0.0b2.dev2026050306" }
# Mojo nightly builds are compiled against a specific CPython minor version;
# update the minor bound together with mojo/pontoneer when upgrading.
python = ">=3.14,<3.15"
# The mojo-community channel ships a zlib 0.1.0 stub that satisfies no real
# version constraint; pin to the real conda-forge zlib so that pyarrow's
# libopentelemetry-cpp → prometheus-cpp → zlib chain can resolve on linux-64.
zlib = ">=1.3.1"
