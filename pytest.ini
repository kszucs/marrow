[pytest]
# Tests and benchmarks live next to the code they cover (marrow/**/tests/,
# python/marrow/tests/); `golden/` is the cross-lane query corpus, `fuzz/`
# the fuzz harnesses and the replay of their committed corpus, and `devkit/`
# the developer tooling that runs all of it.
testpaths = marrow python golden fuzz devkit
# `.` makes `devkit` importable; `python` makes `marrow` importable.
pythonpath = . python
python_files = test_*.py bench_*.py
addopts =
